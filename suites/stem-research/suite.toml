[suite]
name = "stem-research"
description = "110 questions from seven public benchmarks, from grade-school science to frontier research, tagged by difficulty tier."
# Built by `evalh fetch suites/stem-research` from mix.toml; not committed (see .gitignore).
dataset = "cases.jsonl"
system_prompt = """Answer the question. Work through it as carefully as it needs, then finish with a final line of the form
ANSWER: <your answer>
For multiple-choice questions, give only the option letter. For numeric answers, give only the number. Otherwise give a short answer."""
prompt_template = "{question}"

[model]
provider = "anthropic"
model = "claude-opus-5-5"
# Hard questions can need long reasoning; the provider streams, so a high ceiling is safe.
max_tokens = 64000
effort = "medium"

[run]
reps = 3
concurrency = 4
timeout_s = 900

[mock]
answer_template = "Working through the question.\nANSWER: {answer}"

[[graders]]
type = "answer_match"
name = "correct"
primary = true
# Only free-text answers (HLE short answers, QASPER) go to the judge; letters, labels and
# numbers are checked exactly. The judge is a different model from the default one under test.
judge_model = "claude-sonnet-5-5"
