# Cases with a problem in the case itself, found by reading questions a model failed.
#
# Rule, fixed before re-scoring: only HIGH-confidence problems with a concrete, checkable
# argument are excluded (no `exclude` key). Medium/low-confidence findings are recorded with
# `exclude = false`: they stay in every score. Reasons avoid reproducing question text, at the
# datasets' request. Train cases were reviewed in round 2; test cases by a separate key audit
# after tuning stopped, which judged keys only and proposed no prompt changes.
#
# Limitation: only questions the model failed at least once were audited, so a wrong key
# that the model happened to match would not have been caught.

# ---- Excluded: answer key is wrong (high confidence) ----

